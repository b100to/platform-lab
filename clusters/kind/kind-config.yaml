# 4-node kind cluster: 1 control-plane + 3 workers.
# Multi-worker is required to exercise node-failure scenarios and
# TopologySpreadConstraints — the reason this lab exists.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host:8080 -> ingress controller (http)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # host:8443 -> ingress controller (https)
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP

  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
