# 4-node kind cluster: 1 control-plane + 3 workers.
# Multi-worker is required to exercise placement and spread behaviour.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab

# Two workarounds for running a control plane on macOS, where the container
# filesystem makes etcd fsync slow enough (200ms+, spiking past 700ms) that
# lease renewals time out and kube-controller-manager crash-loops on
# "leaderelection lost".
#
#   1. etcd on /tmp, which kind mounts as tmpfs -> writes stay in RAM.
#      Trade-off: restarting the control-plane container wipes cluster state.
#      Acceptable here because everything is reapplied from this repo.
#   2. Leader election off. With a single control-plane there is nothing to
#      elect against, so the lease is pure overhead and a failure mode.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    etcd:
      local:
        dataDir: /tmp/etcd
    controllerManager:
      extraArgs:
        leader-elect: "false"
    scheduler:
      extraArgs:
        leader-elect: "false"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host:18080 -> ingress controller (http). 8080/8443 avoided: already taken locally.
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      # host:18443 -> ingress controller (https)
      - containerPort: 30443
        hostPort: 18443
        protocol: TCP

  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
