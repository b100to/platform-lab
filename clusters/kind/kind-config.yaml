# 4-node kind cluster: 1 control-plane + 3 workers.
# Multi-worker is required to exercise placement and spread behaviour.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab

# Leader election off. On macOS the container filesystem made etcd fsync slow
# enough (200ms+, spiking past 700ms) that lease renewals timed out and
# kube-controller-manager crash-looped on "leaderelection lost". With a single
# control plane there is nothing to elect against, so the lease was pure
# overhead and a failure mode.
#
# etcd used to be moved to /tmp (tmpfs) as a second workaround for the same
# symptom. It is gone: measured against this config, disk-backed etcd logs no
# slow-fsync warnings and no component restarts, so tmpfs bought nothing while
# costing the whole cluster on every container restart -- kindnet, kube-proxy,
# coredns and the kubeadm:cluster-admins binding live in etcd and are written
# only at cluster creation, so no amount of reapplying this repo brings them
# back. See docs/devlog.md.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        leader-elect: "false"
    scheduler:
      extraArgs:
        leader-elect: "false"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # host:18080 -> ingress controller (http). 8080/8443 avoided: already taken locally.
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
      # host:18443 -> ingress controller (https)
      - containerPort: 30443
        hostPort: 18443
        protocol: TCP

  # One node reserved for infrastructure, two for workloads.
  #
  # An operator that empties nodes cannot live on a node it is emptying, and
  # neither can ingress or anything else expected to answer while the cluster
  # is idle. Splitting the roles also makes "how many nodes became removable"
  # a fraction that can actually reach its denominator: reclaimable capacity
  # is the two app nodes, not all three.
  #
  # The role label deliberately does not use the node-role.kubernetes.io/
  # prefix. Labels here are applied by kubelet at registration, and the
  # NodeRestriction admission plugin refuses to let a kubelet label itself
  # with that prefix — the node never registers and the join fails with a
  # misleading "could not find a JWS signature" error.
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
      platform-lab.dev/role: infra
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: dedicated
              value: infra
              effect: NoSchedule
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
      platform-lab.dev/role: app
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
      platform-lab.dev/role: app
