<svg xmlns="http://www.w3.org/2000/svg" width="920" height="322" viewBox="0 0 920 322" role="img" aria-label="사용자는 Google 계정으로 Authentik에 로그인하고 Authentik이 앱의 능력에 따라 다섯 방식으로 연동한다. 설정은 Git에서, 시크릿은 Secrets Manager에서 온다">
