<svg xmlns="http://www.w3.org/2000/svg" width="920" height="224" viewBox="0 0 920 224" role="img" aria-label="nodeTaintsPolicy 비교: Ignore는 taint 노드를 0개 도메인으로 세어 세 번째 pod이 Pending, Honor는 제외해 2대1 배치">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1.5 1.2 L6.8 4 L1.5 6.8" fill="none" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="920" height="224" fill="#FFFFFF"/>
<text x="24" y="58" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Ignore</text>
<text x="80" y="58" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">기본값</text>
<text x="24" y="80" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">taint 노드도 도메인으로 셈</text>
