<text x="694" y="82" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">2 vs 0 → skew 2 (한도 1 초과)</text>
<line x1="24" y1="116" x2="896" y2="116" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
<text x="24" y="162" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" fill="#1F3A5F" text-anchor="start">Honor</text>
