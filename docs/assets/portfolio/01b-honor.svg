<text x="427" y="44" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">앱 노드 2</text>
<rect x="416.0" y="62" width="22" height="22" rx="2" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="1.5"/>
