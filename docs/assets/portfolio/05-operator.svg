<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="IdleWindow 정책과 WakeRequest 요청을 Controller가 현재 상태와 비교하고 Deployment annotation에 복원 기준을 보존한다. 노드 제거는 외부 책임이다">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M1.5 1.2 L6.8 4 L1.5 6.8" fill="none" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="920" height="280" fill="#FFFFFF"/>
<text x="24" y="30" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">선언</text>
<text x="292" y="30" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#1F3A5F" text-anchor="start">현재 상태를 반복 비교</text>
<text x="612" y="30" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">제어 대상 · 같은 namespace</text>
<rect x="24" y="44" width="218" height="54" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
<text x="133.0" y="68.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">IdleWindow</text>
<text x="133.0" y="86.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">축소 · 복원 시각 / 정책</text>
<rect x="24" y="110" width="218" height="54" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
<text x="133.0" y="134.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">WakeRequest</text>
<text x="133.0" y="152.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">임시 기동 / 만료 시각</text>
<line x1="246" y1="72" x2="282" y2="91" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="246" y1="137" x2="282" y2="111" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="292" y="67" width="264" height="70" rx="3" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="424.0" y="99.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#1F3A5F" text-anchor="middle">Reconcile</text>
<text x="424.0" y="117.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">시간 + 정책 + 실제 replica</text>
<line x1="560" y1="101" x2="602" y2="101" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="612" y="67" width="284" height="70" rx="3" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
<text x="754.0" y="99.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle">Deployment</text>
<text x="754.0" y="117.0" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">annotation: 원래 값 + 적용 값</text>
<line x1="754" y1="142" x2="754" y2="162" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<line x1="754" y1="162" x2="424" y2="162" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>
<line x1="424" y1="162" x2="424" y2="142" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="573" y="181" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">변경을 관찰하고 다시 조정</text>
<line x1="24" y1="195" x2="896" y2="195" stroke="#D1D5DB" stroke-width="1" stroke-linecap="round"/>
<text x="24" y="219" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">충돌 회피</text>
<text x="110" y="219" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">HPA 기본 회피 · 수동 변경 존중</text>
<text x="482" y="219" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">상태 보고</text>
<text x="568" y="219" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#374151" text-anchor="start">회수 request · HPA / PDB 차단 사유</text>
<text x="24" y="254" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="start">책임 경계</text>
<text x="110" y="254" font-family="'Helvetica Neue','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">Operator는 Deployment를 조정한다. 노드 제거는 별도 오토스케일러가 담당한다.</text>
</svg>
