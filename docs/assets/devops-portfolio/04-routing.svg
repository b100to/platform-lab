<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Istio 서비스 메시에서 Traefik 인그레스로</title>
  <desc id="desc">이전에는 ALB, Istio ingress와 서비스별 sidecar, istiod 제어면이 있었다. 현재는 ALB가 TLS를 종료하고 Traefik의 IngressRoute와 Middleware가 서비스 라우팅을 담당한다. 별도 ALB 병행, DNS 가중 전환, 안정 확인 후 Istio 제거 순으로 전환한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#172b46}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52647b}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.control{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
  <rect width="1200" height="560" rx="18" fill="#fff"/>
  <text x="30" y="43" class="title">04  라우팅 단순화 · 필요한 인그레스 기능에 집중</text>
  <rect x="24" y="75" width="1152" height="198" rx="16" fill="#f4f5f7" stroke="#dce2e9"/>
  <text x="47" y="116" class="label">이전 · Istio</text>
  <text x="47" y="150" class="small">메시 제어면</text><text x="47" y="181" class="small">+ pod별 proxy</text>
  <rect x="230" y="132" width="142" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="278" y="184" class="label">ALB</text>
  <path d="M384 175 H424" class="line"/>
  <rect x="437" y="132" width="217" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="464" y="183" class="label">Istio ingress</text>
  <path d="M667 175 H714 V139 H757" class="line"/>
  <path d="M714 175 V219 H757" class="line"/>
  <rect x="770" y="110" width="380" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="792" y="147" class="body">서비스 A</text><rect x="989" y="119" width="147" height="40" rx="7" fill="#f9e9e5"/><text x="1008" y="146" class="small">sidecar</text>
  <rect x="770" y="190" width="380" height="58" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="792" y="227" class="body">서비스 B</text><rect x="989" y="199" width="147" height="40" rx="7" fill="#f9e9e5"/><text x="1008" y="226" class="small">sidecar</text>
  <rect x="447" y="84" width="126" height="35" rx="8" fill="#e7ebf0"/>
  <text x="480" y="109" class="small">istiod</text><path d="M587 101 H682 V147 H667" class="control"/>
  <rect x="24" y="292" width="1152" height="177" rx="16" fill="#f0f9f8" stroke="#b8dcd7"/>
  <text x="47" y="335" class="label">현재 · Traefik</text>
  <text x="47" y="371" class="small">TLS와 앱 라우팅</text><text x="47" y="403" class="small">책임 분리</text>
  <rect x="230" y="335" width="142" height="100" rx="12" fill="#fff" stroke="#a9cdc8"/>
  <text x="278" y="374" class="label">ALB</text><text x="260" y="409" class="small">TLS 종료</text>
  <path d="M384 385 H424" class="line"/>
  <rect x="437" y="319" width="270" height="127" rx="12" fill="#d9f1eb" stroke="#8fc5b9"/>
  <text x="523" y="354" class="label">Traefik</text>
  <text x="494" y="389" class="small">IngressRoute</text><text x="504" y="421" class="small">Middleware</text>
  <path d="M720 385 H751 V346 H795" class="line"/>
  <path d="M751 385 V420 H795" class="line"/>
  <rect x="808" y="318" width="342" height="57" rx="10" fill="#fff" stroke="#a9cdc8"/>
  <text x="930" y="355" class="body">서비스 A</text>
  <rect x="808" y="392" width="342" height="57" rx="10" fill="#fff" stroke="#a9cdc8"/>
