<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">분리된 저장소에서 GitOps 모노레포로</title>
  <desc id="desc">이전에는 Terraform Cloud와 환경 브랜치를 사용하는 Terraform 저장소, 서비스별 Helm 차트를 가진 manifest 저장소가 분리되어 있었다. 현재는 공통 모듈과 스택, 공통 차트와 서비스 values를 GitOps 모노레포에서 관리하고 Terraform과 Argo CD로 실행한다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#172b46} .title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52647b}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1200" height="520" rx="18" fill="#fff"/>
  <text x="30" y="43" class="title">01  저장소 개편 · 공통 규칙과 서비스 입력 분리</text>
  <rect x="24" y="72" width="302" height="414" rx="18" fill="#f4f5f7" stroke="#dce2e9"/>
  <text x="46" y="108" class="label">이전 · 분리 저장소</text>
  <rect x="44" y="134" width="262" height="129" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="62" y="170" class="label">Terraform repo</text>
  <text x="62" y="206" class="body">Terraform Cloud</text>
  <text x="62" y="237" class="small">환경별 브랜치</text>
  <rect x="44" y="285" width="262" height="129" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="62" y="321" class="label">Manifest repo</text>
  <text x="62" y="357" class="body">서비스별 Helm chart</text>
  <text x="62" y="388" class="small">배포 설정 별도 관리</text>
  <text x="46" y="458" class="small">인프라 · 배포 맥락 분산</text>
  <path d="M340 276 H374" class="line"/>
  <rect x="390" y="72" width="786" height="414" rx="18" fill="#f0f9f8" stroke="#b8dcd7"/>
  <text x="414" y="108" class="label">현재 · GitOps 모노레포</text>
  <rect x="412" y="136" width="246" height="112" rx="12" fill="#fff" stroke="#a9cdc8"/>
  <text x="430" y="172" class="label">modules / imports</text>
  <text x="430" y="209" class="small">공통 코드 · 생성 규칙</text>
  <path d="M669 192 H701" class="line"/>
  <rect x="714" y="136" width="175" height="112" rx="12" fill="#d9f1eb" stroke="#8fc5b9"/>
  <text x="734" y="172" class="label">stacks</text>
  <text x="734" y="209" class="small">대상 · 환경</text>
  <path d="M901 192 H933" class="line"/>
  <rect x="946" y="136" width="208" height="112" rx="12" fill="#fff" stroke="#a9cdc8"/>
  <text x="968" y="172" class="label">Terraform</text>
  <text x="968" y="209" class="body">AWS 리소스</text>
  <rect x="412" y="280" width="246" height="150" rx="12" fill="#fff" stroke="#a9cdc8"/>
  <text x="430" y="313" class="label">charts/app</text>
  <text x="430" y="343" class="small">templates · helpers</text>
  <text x="430" y="379" class="label">+ values/apps</text>
  <text x="430" y="408" class="small">서비스 · 환경 입력</text>
  <path d="M669 353 H701" class="line"/>
  <rect x="714" y="299" width="175" height="112" rx="12" fill="#d9f1eb" stroke="#8fc5b9"/>
  <text x="734" y="337" class="label">Argo CD</text>
  <text x="734" y="374" class="small">배포 동기화</text>
  <path d="M901 353 H933" class="line"/>
  <rect x="946" y="299" width="208" height="112" rx="12" fill="#fff" stroke="#a9cdc8"/>
  <text x="968" y="337" class="label">Kubernetes</text>
  <text x="968" y="374" class="body">워크로드</text>
  <text x="414" y="462" class="small">Terramate: DRY 유지 · 읽기 쉬운 Terraform 생성</text>
</svg>
