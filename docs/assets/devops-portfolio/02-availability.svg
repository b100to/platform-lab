<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">배치부터 장애 복구 이후 재분산까지</title>
  <desc id="desc">노드 A에 몰린 두 pod을 TSC로 노드 A와 B에 분산한다. A 장애 시 Honor와 여유 용량을 전제로 B에 대체 pod을 배치한다. 노드 복귀만으로는 분포가 바뀌지 않으므로 Descheduler와 PDB로 재분산하는 설계다. Karpenter의 AZ별 노드 공급이 이를 받친다. 마지막 단계는 의도된 교정 흐름이다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
  <style>text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;fill:#172b46}.title{font-size:28px;font-weight:700}.label{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#52647b}.pod{fill:#d3e9ff;stroke:#76a5d4;stroke-width:1.5}.node{fill:#fff;stroke:#b8c7d7;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1200" height="520" rx="18" fill="#fff"/>
  <text x="30" y="43" class="title">02  워크로드 가용성 · 배치 → 장애 대응 → 재분산</text>
  <text x="1000" y="43" class="small">replica 2 예시</text>
  <rect x="24" y="78" width="264" height="292" rx="16" fill="#f6f4f4" stroke="#e3d8d8"/>
  <text x="43" y="117" class="label">이전 · 한쪽에 쏠림</text>
  <text x="43" y="150" class="small">노드 하나가 단일 장애점</text>
  <rect x="44" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="61" y="206" class="body">노드 A</text>
  <rect x="57" y="223" width="74" height="37" rx="8" class="pod"/><text x="77" y="250" class="small">pod</text>
  <rect x="57" y="275" width="74" height="37" rx="8" class="pod"/><text x="77" y="302" class="small">pod</text>
  <rect x="164" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="181" y="206" class="body">노드 B</text><text x="179" y="274" class="small">비어 있음</text>
  <path d="M296 238 H315" class="line"/>
  <rect x="324" y="78" width="264" height="292" rx="16" fill="#f0f9f8" stroke="#b8dcd7"/>
  <text x="343" y="117" class="label">분산 배치 · 1 : 1</text>
  <text x="343" y="150" class="small">TSC · hostname 강제</text>
  <rect x="344" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="361" y="206" class="body">노드 A</text>
  <rect x="357" y="247" width="74" height="37" rx="8" class="pod"/><text x="377" y="274" class="small">pod</text>
  <rect x="464" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="481" y="206" class="body">노드 B</text>
  <rect x="477" y="247" width="74" height="37" rx="8" class="pod"/><text x="497" y="274" class="small">pod</text>
  <path d="M596 238 H615" class="line"/>
  <rect x="624" y="78" width="264" height="292" rx="16" fill="#f0f6fd" stroke="#bfd3e9"/>
  <text x="643" y="117" class="label">노드 A 장애 · 0 : 2</text>
  <text x="643" y="150" class="small">Honor + 생존 노드 여유</text>
  <rect x="644" y="174" width="100" height="156" rx="12" fill="#fff5f3" stroke="#d89285" stroke-dasharray="5 4"/>
  <text x="661" y="206" class="body">노드 A</text>
  <path d="M674 241 L714 283 M714 241 L674 283" stroke="#bc5d50" stroke-width="4"/>
  <text x="674" y="317" class="small">장애</text>
  <rect x="764" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="781" y="206" class="body">노드 B</text>
  <rect x="777" y="223" width="74" height="37" rx="8" class="pod"/><text x="797" y="250" class="small">pod</text>
  <rect x="777" y="275" width="74" height="37" rx="8" class="pod"/><text x="797" y="302" class="small">pod</text>
  <path d="M896 238 H915" class="line"/>
  <rect x="924" y="78" width="252" height="292" rx="16" fill="#f0f9f8" stroke="#b8dcd7"/>
  <text x="941" y="117" class="label">복귀 후 · 다시 1 : 1</text>
  <text x="941" y="150" class="small">Descheduler + PDB</text>
  <rect x="940" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="957" y="206" class="body">노드 A</text>
  <rect x="953" y="247" width="74" height="37" rx="8" class="pod"/><text x="973" y="274" class="small">pod</text>
  <rect x="1060" y="174" width="100" height="156" rx="12" class="node"/>
  <text x="1077" y="206" class="body">노드 B</text>
  <rect x="1073" y="247" width="74" height="37" rx="8" class="pod"/><text x="1093" y="274" class="small">pod</text>
  <text x="635" y="404" class="small">복귀만으로는 0 : 2 유지 → 재배치 필요</text>
  <rect x="24" y="432" width="1152" height="60" rx="12" fill="#e8eef6"/>
  <text x="46" y="469" class="body">Karpenter · AZ별 NodePool로 분산할 노드 공급</text>
  <text x="710" y="469" class="small">2노드 예시 · 마지막 단계는 교정 설계</text>
</svg>
