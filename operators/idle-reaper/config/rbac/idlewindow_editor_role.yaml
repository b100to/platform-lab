# This rule is not used by the project idle-reaper itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the finops.b100to.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: idle-reaper
    app.kubernetes.io/managed-by: kustomize
  name: idlewindow-editor-role
rules:
- apiGroups:
  - finops.b100to.dev
  resources:
  - idlewindows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - finops.b100to.dev
  resources:
  - idlewindows/status
  verbs:
  - get
