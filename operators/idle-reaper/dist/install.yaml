  name: idlewindows.finops.b100to.dev
spec:
  group: finops.b100to.dev
  names:
    kind: IdleWindow
    listKind: IdleWindowList
    plural: idlewindows
    shortNames:
    - iw
    singular: idlewindow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.affectedWorkloads
      name: Scaled
      type: integer
    - jsonPath: .status.skippedWorkloads
      name: Skipped
      type: integer
    - jsonPath: .status.reclaimed.cpu
      name: CPU
      type: string
    - jsonPath: .status.drainableNodes
      name: Drainable
      type: string
    - jsonPath: .status.workerNodes
