# Identical labels to lab-dev/api, in a different namespace.
# A window in lab-dev must never touch this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab-prod
  labels: { app: demo, tier: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: demo, tier: api } }
  template:
    metadata:
      labels: { app: demo, tier: api }
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 64Mi }
